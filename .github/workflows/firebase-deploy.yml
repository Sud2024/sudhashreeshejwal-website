name: Deploy Flutter Web to Firebase

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.0"

      - name: Install Dependencies
        run: |
          flutter pub get
          flutter pub outdated

      - name: Provide build-time secrets file
        shell: bash
        env:
          SENDINBLUE_API_KEY: ${{ secrets.SENDINBLUE_API_KEY }}
        run: |
          cat > lib/secrets.dart <<'EOF'
          class Secrets {
            static const String sendinblueApiKey = String.fromEnvironment('SENDINBLUE_API_KEY');
          }
          EOF

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Verify Firebase CLI
        run: firebase --version

      - name: Build Flutter Web
        run: flutter build web --release --dart-define=SENDINBLUE_API_KEY="${{ secrets.SENDINBLUE_API_KEY }}"

      - name: Deploy to Firebase
        run: firebase deploy --token "${{ secrets.FIREBASE_TOKEN }}"
